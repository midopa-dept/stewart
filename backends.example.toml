# stewart 백엔드 정의 예시. 모두 OpenAI /v1/chat/completions 형식.
# 쓰는 법: 이 파일을 ~/.config/stewart/backends.toml 로 복사해 고친다(또는 STEWART_BACKENDS=<파일>).
# 찾는 차례: STEWART_BACKENDS → $XDG_CONFIG_HOME/stewart/backends.toml(~/.config/stewart/backends.toml) → 저장소 뿌리 backends.toml
# 필드: base_url, model, precision(정밀도 라벨, 기록용), max_context(토큰), enabled,
#       api_key_env(키를 담은 환경변수 이름; 값은 파일에 적지 않는다), timeout_s, concurrency(한 프로세스의 동시 요청 상한),
#       [backends.<이름>.params] 요청 본문에 그대로 합칠 값(temperature, chat_template_kwargs, max_tokens 등)
# vLLM 서버면 실제 문맥 길이는 시작할 때 /v1/models 의 max_model_len 에서 다시 읽는다(STEWART_SERVED_CONTEXT=0 이면 안 읽음).

default = "local"

[backends.local]
description = "이 기기의 llama.cpp llama-server"
base_url = "http://127.0.0.1:8080/v1"
model = "local-model"
precision = "Q4_K_M"
max_context = 16384          # llama-server --ctx-size 와 맞춘다
enabled = true
timeout_s = 600

[backends.local.params]
temperature = 0.2
chat_template_kwargs = { enable_thinking = false }

[backends.cloud]
# 빌린 GPU 의 vLLM. 공개 포트를 열지 않고 사설망(예: Tailscale)이나 SSH 터널로만 닿게 둔다.
description = "원격 GPU vLLM(사설망)"
base_url = "http://gpu.example-tailnet.ts.net:8000/v1"
model = "qwen3.8-27b"                 # vLLM --served-model-name
precision = "W4A16"
max_context = 65536
concurrency = 8
enabled = true
api_key_env = "STEWART_CLOUD_API_KEY" # vLLM --api-key 를 쓰면 그 값을 담은 환경변수 이름(비어 있으면 키 없이 보냄)
timeout_s = 240                       # 한 요청 상한. 큰 파일 쓰기가 잘리지 않게 max_tokens 와 짝
# effort_values = ["xhigh", "medium", "low"]   # 이 서버의 대화 틀이 받는 노력(reasoning_effort) 낱말 — 틀마다 다르다(이 모델 계열은 셋).
#                                     # 적으면 밖의 값(예: "high")은 시작할 때 알리고 보내지 않는다. 안 적으면 그대로 보내는데,
#                                     # 틀이 모르는 값은 오류 없이 다른 수준(기본)으로 처리될 수 있다.

[backends.cloud.params]
temperature = 0.2
chat_template_kwargs = { enable_thinking = false }
max_tokens = 8192                     # 단계당 생성 상한(늘어지는 생성 막기). finish_reason=length 는 summary length_stops

# Anthropic Messages API(판 69). 키는 파일에 적지 않는다 — api_key_env 에 환경 변수 이름만.
# 꾸러미: uv sync --extra anthropic (또는 pip install 'stewart[anthropic]')
# [backends.claude-opus]
# kind = "anthropic"
# model = "claude-opus-5-5"            # 또는 claude-sonnet-5-5
# precision = "api"
# max_context = 1000000
# api_key_env = "ANTHROPIC_API_KEY"
# timeout_s = 600
# concurrency = 4
# [backends.claude-opus.params]
# effort = "high"                      # low | medium | high | xhigh | max (Opus 5.5 기본 medium)
# max_retries = 4                      # 429·529·5xx·연결은 SDK 가 다시
# max_tokens = 32000
# # cache_ttl = "1h"                   # 프롬프트 캐시 유지(기본 5분)
# # price = { input = 4.0, output = 20.0, cache_read = 0.2, cache_write = 5.0 }   # 1M 토큰당 $, 없으면 안의 표

# ── LoRA 어댑터 고르기(판 96) — 학습한 어댑터를 서빙에 올린 뒤 ──
# vLLM(--enable-lora --lora-modules my-lora-v1=/경로): 요청의 model 칸을 어댑터 이름으로 바꾼다
# [backends.cloud]
# adapters = { v1 = "my-lora-v1" }   # 판 이름 → 서버 쪽 이름
# adapter = "v1"                       # 지금 판(지우면 기반). 되돌리기 한 줄: STEWART_ADAPTER=off
# llama.cpp(--lora 파일 --lora-init-without-apply): 요청의 lora 칸에 [{id, scale}] — 고르지 않은 어댑터는 scale 0
# adapters = { v1 = 0 }                # 판 이름 → 서버에 실린 순서 번호
# adapter = "v1"
# adapter_style = "lora"
# adapter_scale = 1.0
# 확인: stewart adapter [-b cloud]  (서버 목록에 실렸는지 대조)

# ── 등급(판 110·113·115·116) — 모델의 크기가 아니라 일을 시키는 방식(지시문 두께·도구·생각·문맥 예산)을 이름 하나로 묶는다 ──
# 이름은 이 표에서만 정한다(바꿔도 코드는 그대로). backend 를 안 적은 등급은 기본 모델을 쓴다 — 다른 모델이 있으면 backend 한 줄을 더한다.
# 작업자(workers spawn)에게는 등급 이름과 use 한 줄만 보인다. 안 고르면 default_for 로(read = 도구를 안 적은 읽기 일, write = 도구를 적은 일).
# 메인으로 앉히려면 stewart hub --tier <이름> (chat --tier 도 같다). slim = true 면 그때 얇은 꼴(짧은 지시·핵심 도구, 나머지는 허브 칩).
# 동시에 몇을 돌릴지는 그 백엔드의 concurrency(서버의 동시 요청 수)가 정한다. max 로 더 줄일 수 있다.
# 생각 칸(안 적으면 지금과 같다): think = true|false · think_max_tokens · think_max_tokens_first(차례 첫 걸음) ·
#   reasoning_effort = "<낱말>" · reasoning_effort_at = "body"|"template" · think_sampling = "<묶음>" 또는 { temperature = … }
# [tiers.presto]
# # backend = "<다른 모델이 있으면 그 백엔드 이름>"
# budget = 24000
# slim = true                  # 메인으로 앉힐 때 얇은 허브(작업자일 때는 뜻 없음)
# use = "찾기·읽기·요약(결과는 검산)"
# default_for = ["read"]
# [tiers.moderato]
# budget = 32000               # 잠정값 — 개발 실측(압축 창·대화 몫) 결과로 다시 정한다. 등급을 안 고르면 지금 동작 그대로
# use = "코딩·대화의 기본"
# default_for = ["write"]
# [tiers.largo]
# max = 1                      # 서버 창 전부(budget 없음) — 모든 기능의 메인: stewart hub --tier largo
# use = "계획·분배·검토"
# rubato(바깥의 큰 모델)는 이 표에 두지 않는다 — 글이 그 회사로 나가고 돈이 드니, 따로 도는 허브로 띄워 사람이 열 때만 쓴다.
#   표에 없는 등급을 --tier 로 부르면 거절한다(기본 모델로 대신하지 않는다):
#   stewart instance <이름> start   (자기 backends·작업 폴더·기억, OS 샌드박스 — README "따로 도는 허브")
