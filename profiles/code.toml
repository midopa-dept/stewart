# 코딩 프로필(무인 run). 다이어트 b: "*" 대신 목록. E5 의 v1.2·v2 에서 한 번도 안 쓰인
# multi_edit·todo_read·notebook_edit·shell_kill 은 뺐다(chat 프로필은 그대로 "*"). shell_output 은 백그라운드 때문에 남긴다.
# ask_user·delegate 는 "*" 때처럼 열어 둔다(목록에 적어야 열린다). 웹 도구는 검색 주소가 있을 때만 붙는다.
name = "code"
description = "작업 폴더의 코드를 읽고 고치고 테스트를 돌린다."
tools = ["read_file", "list_dir", "write_file", "edit_file", "search", "glob", "todo_write",
         "web_search", "web_fetch", "run_shell", "shell_output", "ask_user", "delegate"]
# workdir 를 두지 않는다: --workdir 가 없으면 지금 폴더에서 돈다(데모는 demos/code/make_practice_repo.py 로 만든 폴더)
max_steps = 30
max_consecutive_errors = 4
shell_timeout_s = 60
language = "ko"   # 최종 보고 한국어 강제
# 실행이 끝난 뒤 엔진이 직접 돌리는 성공 판정(모델 말과 무관)
verify_command = "python3 -m unittest -q"
# 최종 답 직전에 verify_command 를 돌려 실패하면 출력을 모델에 돌려주고 다시(최대 2회, 시험 없음 exit 5 는 건너뜀).
# 평가에서 끄기: STEWART_CHECK_ON_STOP=0
check_on_stop = true
rollback_unfinished = true   # 끝내지 못한 run 은 바꾼 파일을 되돌린다. chat 은 끔(사람이 /undo)   # macOS 는 python3 만 있다

# 지시문은 표([...]) 앞에 둔다. 표 아래에 두면 TOML 이 그 표의 키로 읽어 지시문이 빠진다.
system = """
너는 코딩 에이전트다. 작업 폴더의 저장소에서 과제를 끝까지 해낸다.
- 먼저 list_dir·read_file로 코드와 테스트를 읽는다. 테스트를 돌려 실패를 확인한다(run_shell).
- 고칠 때는 edit_file(부분 치환)을 우선 쓰고, old에는 파일 내용을 공백까지 정확히 옮긴다.
- 테스트 파일은 고치지 않는다. 구현 코드를 고친다.
- 고친 뒤 테스트를 다시 돌려 모두 통과하는지 확인한다.
- 요청이 둘 이상으로 읽히고 어느 쪽이냐에 따라 결과가 달라지거나, 꼭 필요한 값(대상·이름·기준·값)이 요청과 작업 폴더 어디에도 없으면, 추측하지 말고 파일을 바꾸기 전에 ask_user 로 묻고 멈춘다. 질문은 "어떻게 할까요?" 처럼 막연하게 쓰지 말고, 무엇이 모자라거나 서로 부딪히는지(예: 요청의 X 와 코드의 Y 가 다르다) 짚고 무엇을 정해 주면 되는지 쓴다. 작업 폴더를 읽어 알 수 있는 것은 묻지 않는다.
- 다 끝나면 도구 호출 없이, 무엇을 고쳤는지 한국어로 짧게 보고한다.
- 길이·형식·개수 제약(예: "세 줄로", "숫자 하나로만", "표로만")은 따로 말이 없으면 항목마다가 아니라 최종 응답 전체에 적용한다. 그런 지시가 있으면 머리말·맺음말도 붙이지 않는다.
- 답은 한국어로 쓰고, 다른 문자(한자 등)를 섞지 않는다. 코드·파일 이름·명령은 원문 그대로 둔다.
"""

[output]
format = "free"

[web_search]
# 실행당 검색 상한(월 brave 950 을 모든 용도가 나눠 쓴다 — code 몫 약 100/월). 문서·오류 찾기 1~3회면 된다(it 범주 권함)
max_total = 10
