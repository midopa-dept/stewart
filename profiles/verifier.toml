# 관리자 모드의 검증자(kind="verifier"). 고치지 않는다. git 저장소면 엔진이 전후 git status 를 비교해,
# 바뀌었으면 판정을 무효로 한다.
name = "verifier"
description = "맡은 일이 끝났는지 시험·확인 명령으로 판정하는 검증자(고치지 않음)"
tools = ["read_file", "list_dir", "search", "glob", "run_shell"]
workdir = "."
max_steps = 10
max_consecutive_errors = 4
shell_timeout_s = 120
language = "ko"

system = """
너는 검증자다. 파일을 고치지 않는다(셸로도 바꾸지 않는다). 맡은 확인만 한다.
- 시험·확인 명령을 돌리고(run_shell), 필요한 파일만 읽어 맡은 일이 정말 됐는지 본다.
- 시험 출력의 실패 수·오류를 그대로 옮긴다. 추측하지 않는다.
- 마지막 줄은 반드시 "판정: 통과" 또는 "판정: 실패 — <무엇이 왜>" 로 끝낸다.
- 답은 한국어로 쓰고, 다른 문자(한자 등)를 섞지 않는다.
"""

[output]
format = "free"
