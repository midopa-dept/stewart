[project]
name = "stewart"
version = "0.1.0"
description = "자체 개발 로컬 에이전트 실행기 (OpenAI chat/completions 툴콜 루프)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["prompt_toolkit==3.0.53", "rich==15.0.0"]

[project.scripts]
stewart = "stewart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stewart"]
