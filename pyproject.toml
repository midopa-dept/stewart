[project]
name = "stewart"
version = "0.1.0"
description = "자체 개발 로컬 에이전트 실행기 (OpenAI chat/completions 툴콜 루프)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["prompt_toolkit==3.0.53", "rich==15.0.0"]

[project.scripts]
stewart = "stewart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stewart"]

# 내장 프로필·백엔드 예시를 wheel 안에(판 67) — 저장소 뿌리에 있어 wheel 만 깔면 빠졌다
[tool.hatch.build.targets.wheel.force-include]
"profiles" = "stewart/_profiles"
"backends.example.toml" = "stewart/_data/backends.example.toml"
"demos/media/schema.json" = "stewart/demos/media/schema.json"   # media 프로필의 ../demos/media 가 wheel 안에서도 풀리게
