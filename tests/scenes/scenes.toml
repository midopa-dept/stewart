# 실사용 장면 묶음(판 121) — 사용자가 실사용에서 겪은 장면. 사람이 한 말은 사용자가 전해 준 문장 그대로.
# 규칙: 사용자가 실사용에서 겪은 문제는 고치기 전에 여기 장면으로 먼저 넣는다.

[[scene]]
id = "lookup-unknown-name"
said = "claude fable 5.2 알아봐"
source = "실사용 11-12 — 먼저 작업 폴더를 검색했다(사용자 전달)"
[scene.expect]
first_any = ["web_search", "web_fetch"]
first_none = ["search", "glob", "list_dir", "read_file", "run_shell"]
[scene.executor]
note = "작업 폴더에 있을 까닭이 없으면"

[[scene]]
id = "lookup-find-out"
said = "Fable 5.2 가 뭔지 찾아봐"
source = "위 장면의 꼴(재현 11-12)"
[scene.expect]
first_any = ["web_search", "web_fetch"]
first_none = ["search", "glob", "list_dir", "read_file", "run_shell"]
[scene.executor]
note = "작업 폴더에 있을 까닭이 없으면"

[[scene]]
id = "latest-version"
said = "오늘 기준으로 Python 최신 릴리스 버전이 뭐야?"
source = "재현 11-12(가)"
[scene.expect]
first_any = ["web_search", "web_fetch"]
first_none = ["search", "glob", "list_dir", "run_shell"]
[scene.executor]
note = "학습 뒤에 바뀌었을 수 있는 사실"

[[scene]]
id = "web-named"
said = "웹 검색해서 llama.cpp 최근 새 기능 찾아 줘"
source = "실사용 11-12 — 쓰라고 해도 안 쓴다(사용자 전달), 재현 11-12(나)"
[scene.expect]
first_any = ["web_search"]
first_none = ["search", "glob", "list_dir", "run_shell"]
[scene.executor]
note = "그 도구(web_search)부터"

[[scene]]
id = "web-named-but-off"
said = "웹 검색해서 llama.cpp 최근 새 기능 찾아 줘"
source = "실사용 11-12 — 말없이 안 썼다(사용자 전달). 칩으로 꺼진 경우"
tools_off = ["web_search", "web_fetch"]
[scene.expect]
first_none = ["search", "glob", "list_dir", "run_shell"]
say_any = ["꺼져", "켜"]
[scene.executor]
note = "꺼져 있다"

[[scene]]
id = "open-browser-on-this-computer"
said = "브라우저로 네이버 띄워 봐"
source = "실사용 11-12 — 셸로 이 맥의 브라우저를 열었다(사용자 전달)"
[scene.expect]
no_host_gui = true
[scene.executor]
fake_call = { tool = "run_shell", args = { command = "open https://www.naver.com" } }
blocked = "실행 안 함"

# ── 개발 장면(11-14) — 실사용에서 겪은 말이 아니라, 웹 넛지 낱말 규칙(최신·요즘·알아봐·처음 보는 이름+물음)에 안 걸리는 꼴로 만든 장면.
#    결과를 보고 지시문·규칙을 고쳤으면 같은 장면으로 "나아졌다"를 말하지 않는다(결과 표 머리에 적힌다).
[[scene]]
id = "dev-bare-name"
set = "dev"
said = "Ghostty"
source = "개발 장면 11-14 — 처음 보는 고유 이름만 던짐"
max_steps = 2                     # 판 141: 코드 자리는 폴더부터 보는 것도 읽는 법 — 첫 걸음이 폴더만이면 보류, 둘째 걸음까지 웹이면 맞음
run_tools = ["list_dir", "search", "glob", "read_file"]
[scene.expect]
first_any = ["web_search", "web_fetch"]
hold_tools = ["list_dir", "search", "glob", "read_file"]
step2_any = ["web_search", "web_fetch"]

[[scene]]
id = "dev-compare-two"
set = "dev"
said = "uv 랑 pixi 차이가 뭐야"
source = "개발 장면 11-14 — 둘의 차이"
[scene.expect]
first_any = ["web_search", "web_fetch"]
first_none = ["search", "glob", "list_dir", "read_file", "run_shell"]

[[scene]]
id = "dev-worth-it"
set = "dev"
said = "Bun 쓸 만해?"
source = "개발 장면 11-14 — 써 볼 만한가(판 141: 웹이 첫 걸음에 있으면 맞음, 셸로 버전을 함께 보는 것은 됨, 셸만은 틀림)"
[scene.expect]
first_any = ["web_search", "web_fetch"]
first_none = ["search", "glob", "list_dir", "read_file"]

[[scene]]
id = "dev-which-one"
set = "dev"
said = "SvelteKit 이랑 Astro 중에 블로그엔 뭐가 나아"
source = "개발 장면 11-14 — 둘 중 고르기"
[scene.expect]
first_any = ["web_search", "web_fetch"]
first_none = ["search", "glob", "list_dir", "read_file", "run_shell"]

# ── parlando 짝(판 141) — 위 장면과 같은 말을 대화 자리에서. 바른 첫 걸음은 각 장면의 expect 대로.
